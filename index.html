<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perro Negro Resto Bar</title>
<meta name="theme-color" content="#0b0b0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;700&family=Bebas+Neue&family=Oswald:wght@400;600&family=Montserrat:wght@400;600;700&family=Lora:wght@400;600&family=Cormorant+Garamond:wght@500;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;background:#0b0b0b;color:#eee}
button,input,select,textarea{font:inherit}
/* ================= PÁGINA PÚBLICA Y VISTA PREVIA ================= */
.pub,.pv{position:relative;color:var(--txt);background-color:var(--fondo);background-image:var(--glow),var(--bg);background-size:cover;background-position:center top;background-attachment:scroll}
.pub{min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 36px) 18px calc(env(safe-area-inset-bottom,0px) + 40px)}
.pv{border-radius:26px;padding:26px 16px 30px;height:100%;overflow:auto;transform:translateZ(0)}
.pv .anim{animation:none}
.pg{max-width:440px;margin:0 auto;text-align:center}
.cab{display:flex;flex-direction:column;align-items:center}
.medalla{width:156px;height:156px;border-radius:50%;padding:5px;background:linear-gradient(145deg,var(--acento),#fff3 40%,var(--acento) 70%,#6b5418);box-shadow:0 0 0 7px var(--acentoA),0 22px 46px rgba(0,0,0,.6)}
.medalla img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 18%;background:#0a0a0a;display:block}
.pg[data-ca=rectangulo] .medalla{width:auto;height:auto;padding:0;border-radius:0;background:none;box-shadow:none}
.pg[data-ca=rectangulo] .medalla img{width:210px;height:auto;max-width:70%;border-radius:0;background:none;object-fit:contain}
.pg[data-ca=grande] .medalla{width:100%;height:auto;padding:0;border-radius:18px;background:none;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.pg[data-ca=grande] .medalla img{width:100%;height:auto;max-height:260px;border-radius:18px;object-fit:cover}
.sobre{margin:20px 0 0;font:600 .7rem var(--fx);letter-spacing:.42em;text-transform:uppercase;color:var(--acento)}
.marca{margin:8px 0 0;font-family:var(--ft);font-weight:700;font-size:var(--tn);line-height:1.05;letter-spacing:.06em;text-transform:uppercase;color:var(--txt)}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px auto 14px;width:200px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--acento))}
.orn::after{transform:scaleX(-1)}
.orn i{width:7px;height:7px;background:var(--acento);transform:rotate(45deg);flex:none}
.lema{margin:0 auto;max-width:34ch;color:var(--sub);font-size:.95rem;line-height:1.55}
/* redes */
.redes{list-style:none;margin:24px 0 28px;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.redes a{--c:var(--acento);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--txt);text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s,color .2s}
.redes svg{width:22px;height:22px;display:block}
.redes a:hover{transform:translateY(-3px)}
.redes a:focus-visible{outline:2px solid var(--acento);outline-offset:3px}
.pg[data-er=marca] .redes a{background:var(--c);color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.4)}
.pg[data-er=marca] .redes a:hover{box-shadow:0 10px 26px var(--c)}
.pg[data-er=marca] .redes a[data-r=Instagram]{background:linear-gradient(45deg,#fdc468 0%,#f56040 30%,#e1306c 55%,#833ab4 100%)}
.pg[data-er=marca] .redes a[data-r=TikTok],.pg[data-er=marca] .redes a[data-r=X]{background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.28),0 8px 18px rgba(0,0,0,.4)}
.pg[data-er=dorado] .redes a{background:rgba(0,0,0,.35);border:1px solid var(--acento);color:var(--acento)}
.pg[data-er=dorado] .redes a:hover{background:var(--acento);color:#111}
.pg[data-er=contorno] .redes a{border:2px solid currentColor}
.pg[data-er=contorno] .redes a:hover{color:var(--acento)}
.pg[data-er=acento] .redes a{background:var(--acento);color:#111}
.pg[data-er=simple] .redes a{width:40px;height:40px;color:var(--acento)}
.pg[data-er=simple] .redes a:hover{color:var(--txt);transform:translateY(-3px) scale(1.1)}
/* secciones */
.grupo{margin:0}
.sec{margin:28px 0 12px;display:flex;align-items:center;gap:12px;font:600 .68rem var(--fx);letter-spacing:.32em;text-transform:uppercase;color:var(--acento)}
.sec::before,.sec::after{content:"";flex:1;height:1px;background:var(--borde)}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:11px}
/* banner destacado */
.banner{display:block;position:relative;min-height:150px;border-radius:var(--rad);overflow:hidden;text-decoration:none;color:#fff;background:linear-gradient(135deg,#1c1c1c,#0b0b0b);background-size:cover;background-position:center;border:1px solid var(--borde);margin-bottom:6px;text-align:left;transition:transform .2s}
.banner:hover{transform:translateY(-2px)}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.88))}
.banner .bn-cap{position:absolute;left:16px;right:16px;bottom:14px;z-index:1}
.bn-tag{display:inline-block;font:700 .62rem var(--fx);letter-spacing:.22em;text-transform:uppercase;background:var(--acento);color:#111;padding:4px 9px;border-radius:99px;margin-bottom:8px}
.banner strong{display:block;font-family:var(--ft);font-size:1.25rem;letter-spacing:.03em;text-transform:uppercase}
.banner small{display:block;margin-top:3px;font-size:.88rem;opacity:.85}
/* botones */
.boton{--ac:var(--acento);display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;border-radius:var(--rad);background:var(--card);border:1px solid var(--borde);color:var(--txt);text-decoration:none;text-align:left;box-shadow:0 10px 26px rgba(0,0,0,.28);transition:transform .2s,border-color .2s,background .2s,box-shadow .2s}
.boton:hover{border-color:var(--acento);transform:translateX(3px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.boton:active{transform:scale(.985)}
.boton:focus-visible{outline:2px solid var(--acento);outline-offset:3px}
.bi{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--acentoA);color:var(--acento);font-size:1.35rem;overflow:hidden}
.bi svg{width:23px;height:23px;display:block}
.bi img{width:100%;height:100%;object-fit:cover}
.bt{flex:1;min-width:0}
.bt strong{display:block;font-family:var(--fx);font-weight:600;font-size:calc(1rem * var(--tb,1));line-height:1.25}
.bt small{display:block;margin-top:3px;font-size:.84rem;color:var(--sub);line-height:1.35}
.fl{flex:none;width:18px;height:18px;color:var(--acento);opacity:.75;transition:transform .2s,opacity .2s}
.fl svg{width:18px;height:18px;display:block}
.boton:hover .fl{transform:translateX(3px);opacity:1}
.boton.principal{background:var(--pri);color:var(--priTx);border-color:transparent}
.boton.principal .bt small{color:inherit;opacity:.8}
.boton.principal .bi{background:rgba(0,0,0,.14);color:inherit}
.boton.principal .fl{color:inherit}
.pg[data-eb=contorno] .boton{background:transparent;box-shadow:none}
.pg[data-eb=cristal] .boton{background:rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:rgba(255,255,255,.22)}
.pg[data-eb=retro] .boton{box-shadow:5px 5px 0 var(--acento)}
.pg[data-eb=contorno] .boton.principal,.pg[data-eb=cristal] .boton.principal{background:var(--pri);color:var(--priTx)}
.pg[data-eb=contorno] .boton.principal{background:var(--pri)}
/* botón flotante WhatsApp */
.flot{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.45);z-index:9;transition:transform .2s}
.flot:hover{transform:scale(1.07)}
.flot svg{width:28px;height:28px}
.pv .flot{position:absolute}
.pie{margin:36px 0 0;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}
/* animación de entrada */
@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.anim{animation:subir .55s both;animation-delay:var(--d,0ms)}
@media (prefers-reduced-motion:reduce){.anim{animation:none}.boton,.redes a,.banner{transition:none}.boton:hover,.redes a:hover{transform:none}}
/* ================= EDITOR ================= */
.adm{min-height:100vh;background:#0c0c0c;color:#eee}
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 18px;background:rgba(12,12,12,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #232323}
.logo{font-family:Cinzel,serif;font-weight:700;letter-spacing:.14em;color:#d4af37;font-size:1rem;margin-right:auto}
.logo small{display:block;font:500 .62rem Inter,sans-serif;letter-spacing:.28em;color:#8a8a8a;margin-top:2px}
.estado{font-size:.78rem;color:#9a9a9a;padding:6px 11px;border-radius:99px;background:#181818;border:1px solid #2a2a2a;white-space:nowrap}
.estado.sucio{color:#f5c963;border-color:#5a4612}
.estado.ok{color:#8fd19e;border-color:#21502f}
.btn{background:#1a1a1a;color:#eee;border:1px solid #333;border-radius:10px;padding:9px 14px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:#d4af37;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.oro{background:linear-gradient(135deg,#f1d98a,#d4af37 55%,#a5852a);color:#111;border-color:transparent}
.btn.oro:hover{color:#111;filter:brightness(1.07)}
.btn.peligro{color:#ff9a9a;border-color:#4a2424;background:#170c0c}
.btn.peligro:hover{border-color:#e05a5a;color:#ffb3b3}
.btn.pq{padding:6px 10px;font-size:.8rem;border-radius:8px}
.btn.ic{padding:7px;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px}
.btn.ic svg{width:16px;height:16px}
.btn.ic.peligro svg{color:#ff9a9a}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;max-width:1240px;margin:0 auto;padding:22px 18px 70px}
@media (min-width:1000px){.wrap{grid-template-columns:minmax(0,1fr) 430px}.vista{position:sticky;top:84px;align-self:start}}
.seg{display:flex;gap:4px;padding:4px;background:#141414;border:1px solid #242424;border-radius:13px;margin-bottom:18px;overflow-x:auto}
.seg button{flex:1 0 auto;background:transparent;border:0;color:#a8a8a8;padding:10px 12px;border-radius:10px;font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap}
.seg button:hover{color:#fff}
.seg button.on{background:linear-gradient(135deg,#f1d98a,#d4af37 55%,#a5852a);color:#111}
.panel{display:none;background:#141414;border:1px solid #232323;border-radius:18px;padding:20px}
.panel.on{display:block}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 0 6px}
.ph h2{margin:0;font:700 1.05rem Cinzel,serif;letter-spacing:.06em;color:#f2ead0}
.ph p{margin:0;color:#8f8f8f;font-size:.86rem;line-height:1.45}
.sub{margin:22px 0 10px;font-size:.72rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#d4af37}
.campo{display:block;margin-bottom:14px}
.campo>span{display:block;font-size:.8rem;color:#a4a4a4;margin-bottom:6px;font-weight:500}
.campo small{display:block;margin-top:5px;color:#7d7d7d;font-size:.76rem;line-height:1.4}
.campo small.aviso{color:#f5c963}
input[type=text],input[type=url],input[type=email],input[type=password],input[type=search],select,textarea{width:100%;background:#0c0c0c;color:#f2f2f2;border:1px solid #2c2c2c;border-radius:10px;padding:10px 12px;font-size:.92rem;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:#d4af37}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input[type=color]{width:100%;height:42px;background:#0c0c0c;border:1px solid #2c2c2c;border-radius:10px;padding:4px;cursor:pointer}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.dos{grid-template-columns:1fr}}
.rng{width:100%;accent-color:#d4af37}
.rango{display:flex;justify-content:space-between;font-size:.8rem;color:#a4a4a4;margin-bottom:6px}
.rango b{color:#f2ead0;font-weight:600}
.fila-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swt{display:inline-flex;align-items:center;gap:10px;font-size:.88rem;color:#d7d7d7;cursor:pointer;user-select:none}
.swt input{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:99px;background:#2e2e2e;position:relative;margin:0;cursor:pointer;transition:background .2s;flex:none}
.swt input::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#cfcfcf;transition:left .2s,background .2s}
.swt input:checked{background:#d4af37}
.swt input:checked::after{left:20px;background:#111}
.swt input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.miniatura{width:52px;height:52px;border-radius:12px;background:#0c0c0c;border:1px solid #2c2c2c;display:grid;place-items:center;overflow:hidden;flex:none;color:#d4af37;font-size:1.4rem}
.miniatura img{width:100%;height:100%;object-fit:cover}
.miniatura svg{width:22px;height:22px}
.vacio{padding:26px;border:1px dashed #333;border-radius:14px;text-align:center;color:#8a8a8a;font-size:.9rem;line-height:1.5}
/* lista de enlaces */
.lista-ed{display:grid;gap:9px;margin-top:10px}
.fila{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:#0f0f0f;border:1px solid #232323;border-radius:14px;padding:10px 12px;transition:border-color .15s,opacity .15s}
.fila:hover{border-color:#3a3a3a}
.fila.oculto{opacity:.55}
.fila.sobre-arr{border-color:#d4af37;background:#1a160a}
.grip{color:#666;cursor:grab;display:grid;place-items:center;padding:4px 2px}
.grip svg{width:16px;height:16px}
.fila .txt{flex:1 1 150px;min-width:0}
.fila .txt strong{display:block;font-size:.95rem;color:#f2f2f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .txt small{display:block;color:#8a8a8a;font-size:.8rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:99px;background:#222;color:#bdbdbd;white-space:nowrap}
.chip.warn{background:#3a2c0c;color:#f5c963}
.chip.gold{background:#3a300f;color:#e9cf7a}
.chip.seccion{background:#161616;border:1px solid #2c2c2c;color:#9d9d9d}
.acc{display:flex;align-items:center;gap:6px;margin-left:auto}
/* cajón de edición */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.velo.on{display:block}
.cajon{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#131313;border-left:1px solid #2a2a2a;z-index:41;transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column}
.cajon.on{transform:none}
.cajon-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #232323}
.cajon-h h3{margin:0;font:700 1rem Cinzel,serif;letter-spacing:.06em;color:#f2ead0}
.cajon-b{padding:18px;overflow:auto;flex:1}
.cajon-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:14px 18px;border-top:1px solid #232323;background:#111}
.iconos{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.ico-op{aspect-ratio:1;border-radius:11px;border:1px solid #2c2c2c;background:#0c0c0c;color:#d4af37;display:grid;place-items:center;cursor:pointer;padding:0}
.ico-op svg{width:20px;height:20px}
.ico-op:hover{border-color:#666}
.ico-op.on{border-color:#d4af37;background:#241d08;box-shadow:0 0 0 1px #d4af37 inset}
/* tarjetas de tema */
.temas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.temas{grid-template-columns:1fr}}
.tema{position:relative;text-align:left;background:#0c0c0c;border:1px solid #2c2c2c;border-radius:14px;padding:12px;cursor:pointer;color:#eee;display:flex;align-items:center;gap:12px}
.tema:hover{border-color:#666}
.tema.on{border-color:#d4af37;box-shadow:0 0 0 1px #d4af37 inset}
.tema .sw{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:700 1rem Cinzel,serif;flex:none;border:1px solid rgba(255,255,255,.12)}
.tema b{display:block;font-size:.9rem}
.tema small{display:block;font-size:.76rem;color:#8a8a8a;margin-top:2px}
/* vista previa en celular */
.marco{width:100%;max-width:400px;margin:0 auto;border-radius:38px;padding:11px;background:#1b1b1b;border:1px solid #333;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.marco .pv{height:740px;border-radius:28px}
.vista-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.vista-h span{font-size:.78rem;color:#8a8a8a;letter-spacing:.14em;text-transform:uppercase}
.cuota{height:6px;border-radius:99px;background:#222;overflow:hidden;margin-top:8px}
.cuota i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a5852a,#d4af37);transition:width .3s}
.cuota.alto i{background:#d4501c}
.qr-box{background:#fff;border-radius:14px;padding:12px;display:inline-block}
#qr{display:block;width:230px;height:230px;max-width:100%}
.url{display:block;background:#0c0c0c;border:1px solid #2c2c2c;padding:10px 12px;border-radius:10px;word-break:break-all;font-size:.82rem;color:#cfcfcf;margin:8px 0 12px}
.msg{color:#ff9a9a;min-height:1.2em;font-size:.88rem}
.okmsg{color:#8fd19e;font-size:.88rem}
/* acceso */
.acceso{max-width:380px;margin:12vh auto;padding:28px;background:#141414;border:1px solid #242424;border-radius:20px;text-align:center}
.acceso h2{margin:6px 0 4px;font:700 1.15rem Cinzel,serif;letter-spacing:.08em;color:#f2ead0}
.acceso p{margin:0 0 18px;color:#8a8a8a;font-size:.88rem}
.acceso .campo{text-align:left}
.acceso .btn{width:100%;padding:11px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f1f1f;border:1px solid #3a3a3a;color:#f2f2f2;padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:60;box-shadow:0 14px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.toast.malo{border-color:#6a2a2a;color:#ffb3b3}
svg.i{width:18px;height:18px;display:block}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ============ CONFIGURACIÓN DE FIREBASE (la misma de siempre) ============ */
const FB = {
  apiKey: "AIzaSyAXBUpFF3TQDqc2XQRN6mCcRZ5nZlKVcMU",
  authDomain: "amigos-perro.firebaseapp.com",
  projectId: "amigos-perro",
  appId: "1:82612951530:web:7a2dc1a533a2caea423a93"
};
/* ======================================================================== */

const ok = !FB.apiKey.startsWith("PEGA") && typeof firebase !== "undefined";
let db, auth, ref, refBorrador;
if (ok) {
  firebase.initializeApp(FB);
  db = firebase.firestore(); auth = firebase.auth();
  ref = db.collection("pagina").doc("principal");
  refBorrador = db.collection("pagina").doc("borrador");

  const cab = E("header", "cab");

    const med = E("div", "medalla anim"); med.style.setProperty("--d", dl());

  p.append(acc);
  const qb = E("div", "qr-box"); qb.style.marginTop = "16px"; const cv = E("canvas"); cv.id = "qr"; qb.append(cv); p.append(qb);
  p.append(E("p", "okmsg", "La tarjeta incluye el nombre, el QR con el perro en el centro y una frase para invitar a escanear."));
  p.lastChild.style.marginTop = "14px"; p.lastChild.style.color = "#8f8f8f";
  return p;
}
function crearQR(url, escala) {
  return new Promise(res => {
    if (typeof qrcode === "undefined") return res(null);
    const q = qrcode(0, "H"); q.addData(url); q.make();
    const n = q.getModuleCount(), m = 4, s = escala || 8, c = document.createElement("canvas");
    c.width = c.height = (n + 2 * m) * s;
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.fillStyle = "#000";
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + m) * s, (r + m) * s, s, s);
    const fin = () => res(c);
    if (S && S.avatar) {
      const im = new Image();
      im.onload = () => {
        const w = c.width, z = w * 0.22, k = Math.min(z / im.width, z / im.height);
        x.fillStyle = "#fff"; x.beginPath(); x.arc(w / 2, w / 2, z / 2 + 8, 0, Math.PI * 2); x.fill();
        x.save(); x.beginPath(); x.arc(w / 2, w / 2, z / 2, 0, Math.PI * 2); x.clip();
        x.drawImage(im, (w - im.width * k) / 2, (w - im.height * k) / 2, im.width * k, im.height * k); x.restore(); fin();
      };
      im.onerror = fin; im.src = S.avatar;
    } else fin();
  });
}
function dibujarQR() {
  const cv = $("#qr"); if (!cv) return;
  const url = location.href.split("#")[0];
  crearQR(url, 8).then(src => {
    if (!src) { cv.replaceWith(E("p", "msg", "No cargó el generador de QR. Revisa tu conexión y recarga.")); return; }
    cv.width = src.width; cv.height = src.height; cv.getContext("2d").drawImage(src, 0, 0);
  });
}
async function descargarTarjeta() {
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"), T = temaActivo(S), url = location.href.split("#")[0];
  try { await document.fonts.load("700 100px Cinzel"); await document.fonts.load("400 40px Inter"); } catch (e) {}
  x.fillStyle = T.fondo; x.fillRect(0, 0, W, H);
  x.strokeStyle = T.acento; x.lineWidth = 5; x.strokeRect(48, 48, W - 96, H - 96);
  x.lineWidth = 1.5; x.strokeRect(72, 72, W - 144, H - 144);
  x.textAlign = "center"; x.textBaseline = "alphabetic";
  x.fillStyle = T.acento; x.font = "600 34px Inter, Arial, sans-serif";
  x.fillText((S.sobre || "Resto bar · Tarija").toUpperCase(), W / 2, 170);
  x.fillStyle = T.txt; x.font = "700 104px Cinzel, Georgia, serif";
  x.fillText((S.nombre || "Perro Negro").toUpperCase(), W / 2, 296);
  const qs = 620, bx = (W - qs) / 2, by = 360;
  x.fillStyle = "#ffffff"; x.fillRect(bx, by, qs, qs);
  const qr = await crearQR(url, 14);
  if (qr) x.drawImage(qr, bx + 24, by + 24, qs - 48, qs - 48);
  x.fillStyle = T.acento; x.font = "700 58px Cinzel, Georgia, serif";
  x.fillText("ESCANEA Y ÚNETE", W / 2, 1100);
  x.fillStyle = T.sub; x.font = "400 38px Inter, Arial, sans-serif";
  x.fillText("Amigos, puntos, promociones y más", W / 2, 1168);
  const l = E("a"); l.download = "tarjeta-mesa-perro-negro.png"; l.href = c.toDataURL("image/png"); l.click();
}

/* ---------- guardar / publicar ---------- */
async function guardarBorrador(btn) {
  if (tamano() > 900000) return toast("Las imágenes pesan demasiado. Quita o cambia alguna.", true);
  if (!ok) return toast("Firebase no está conectado.", true);
  try {
    await refBorrador.set({ datos: clone(S), fecha: new Date().toISOString() });
    toast("Borrador guardado. La página pública no cambia hasta que publiques.");
  } catch (e) { toast("No se pudo guardar el borrador: " + e.message, true); }
}
async function publicar() {
  if (tamano() > 900000) return toast("Las imágenes pesan demasiado. Quita o cambia alguna.", true);
  if (!ok) return toast("Firebase no está conectado.", true);
  try {
    await ref.set(clone(S));
    try { await refBorrador.delete(); } catch (e) {}
    PUB = clone(S); sucio = false; estadoUI();
    toast("Publicado. La página ya muestra los cambios.");
  } catch (e) { toast("No se pudo publicar: " + e.message, true); }
}
function descartar() {
  if (!confirm("¿Descartar los cambios que no has publicado?")) return;
  S = clone(PUB); sucio = false; montarEditor(); toast("Cambios descartados.");
}

/* ---------- montaje del editor ---------- */
function marcarPestana() {
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.t === pestana));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.dataset.p === pestana));
}
function montarEditor() {
  const app = $("#app"); app.className = "adm"; app.innerHTML = ""; document.body.style.background = "#0c0c0c";
  const url = location.href.split("#")[0];
  // barra superior
  const bar = E("header", "bar");
  const logo = E("div", "logo", "PERRO NEGRO"); logo.append(E("small", null, "Editor de la central"));
  const est = E("span", "estado", ""); est.id = "estado";
  bar.append(logo, est,
    boton("Ver página", () => window.open(url, "_blank")),
    boton("Descartar", descartar, "pq"),
    boton("Guardar borrador", () => guardarBorrador(), ""),
    boton("Publicar", publicar, "oro"),
    boton("Salir", () => auth.signOut(), "pq"));
  // cuerpo
  const wrap = E("div", "wrap"), col = E("div"), seg = E("div", "seg");
  [["cabecera", "Cabecera"], ["enlaces", "Enlaces"], ["diseno", "Diseño"], ["qr", "QR y enlace"]].forEach(([k, lab]) => {
    const b = E("button", null, lab); b.type = "button"; b.dataset.t = k;
    b.onclick = () => { pestana = k; marcarPestana(); if (k === "qr") dibujarQR(); };
    seg.append(b);
  });
  col.append(seg, buildCabecera(), buildEnlaces(), buildDiseno(), buildQR());
  const vista = E("aside", "vista"), vh = E("div", "vista-h");
  const peso = E("span", null, ""); peso.id = "peso";
  vh.append(E("span", null, "Vista previa · celular"), peso);
  const cuota = E("div", "cuota"); cuota.id = "cuota"; const ci = E("i"); ci.id = "cuota-i"; cuota.append(ci);
  const marco = E("div", "marco"), pv = E("div", "pv"); pv.id = "pv"; marco.append(pv);
  vista.append(vh, cuota, E("div", null, " "), marco);
  vista.lastChild.style.marginTop = "14px";
  wrap.append(col, vista);
  // cajón y velo
  const velo = E("div", "velo"); velo.id = "velo"; velo.onclick = cerrarCajon;
  const cajon = E("aside", "cajon"); cajon.id = "cajon";
  app.append(bar, wrap, velo, cajon);
  renderBanner(); renderRedes(); renderEnlaces(); renderTemas();
  ultimoQR = null; marcarPestana(); estadoUI(); refrescarVista();
  addEventListener("beforeunload", e => { if (sucio) { e.preventDefault(); e.returnValue = ""; } });
  addEventListener("keydown", e => { if (e.key === "Escape") cerrarCajon(); });
}

/* ---------- acceso ---------- */
function login() {
  const a = $("#app"); a.className = "adm"; a.innerHTML = ""; document.body.style.background = "#0c0c0c";
  const card = E("div", "acceso"), e1 = E("input"), e2 = E("input"), msg = E("p", "msg");
  e1.type = "email"; e1.placeholder = "tu@correo.com"; e1.autocomplete = "username";
  e2.type = "password"; e2.placeholder = "Contraseña"; e2.autocomplete = "current-password";
  const c1 = campo("Correo", e1), c2 = campo("Contraseña", e2);
  const go = () => { msg.textContent = ""; auth.signInWithEmailAndPassword(e1.value.trim(), e2.value).catch(() => msg.textContent = "Correo o contraseña incorrectos."); };
  e2.onkeydown = e => { if (e.key === "Enter") go(); };
  const b = boton("Entrar", go, "oro");
  card.append(E("div", "logo", "PERRO NEGRO"), E("h2", null, "Editor de la central"), E("p", null, "Ingresa con la cuenta del restobar."), c1, c2, b, msg);
  card.firstChild.style.margin = "0 auto"; card.firstChild.style.textAlign = "center";
  a.append(card);
}

/* ---------- arranque ---------- */
addEventListener("hashchange", () => location.reload());
if (location.hash === "#admin") {
  if (!ok) { const a = $("#app"); a.className = "adm"; a.append(E("p", "msg", "Falta la configuración de Firebase o no cargó internet.")); }
  else auth.onAuthStateChanged(async u => {
    if (!u) return login();
    let pub = normal(null), borr = null;
    try { const s = await ref.get(); if (s.exists) pub = normal(s.data()); } catch (e) {}
    try { const b = await refBorrador.get(); if (b.exists && b.data().datos) borr = normal(b.data().datos); } catch (e) {}
    PUB = clone(pub);
    S = borr ? borr : clone(pub);
    sucio = !!borr;
    montarEditor();
    if (borr) toast("Estás viendo un borrador guardado. Publica para actualizar la página.");
  });
} else publico();
</script>
